<!DOCTYPE html>
<html lang="pt-br" class="auth-register">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PatriFlow — Criar conta</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body class="login-body">

<div class="register-wrap">
    <div class="register-card">

        <!-- Logo -->
        <div class="text-center mb-5">
            <div class="d-inline-block mb-4 auth-logo-chip">
                <img src="/static/logo.png?v=2" alt="PatriFlow" class="auth-logo-img-sm">
            </div>
            <h1 class="fw-bold mb-1 auth-title-sm">
                Criar conta
            </h1>
            <p class="mb-0 auth-subtitle-sm">
                Acesso de Agente de Campo.
            </p>
        </div>

        {% if erro %}
        <div class="alert-inline error" role="alert">
            <i class="fas fa-exclamation-circle flex-shrink-0 mt-1 alert-icon"></i>
            <span>{{ erro }}</span>
        </div>
        {% endif %}

        <form action="/criar-conta" method="POST" id="registerForm" novalidate>

            <div class="field-wrap">
                <label for="nome">Nome completo</label>
                <i class="fas fa-id-card field-icon-left"></i>
                <input id="nome" name="nome" type="text"
                    class="form-control"
                    maxlength="120"
                    value="{{ nome or '' }}"
                    placeholder="Seu nome"
                    required autofocus>
            </div>

            <div class="field-wrap">
                <label for="username">Usuário</label>
                <i class="fas fa-user field-icon-left"></i>
                <input id="username" name="username" type="text"
                    class="form-control"
                    minlength="3" maxlength="50"
                    pattern="[A-Za-z0-9_.-]+"
                    value="{{ username or '' }}"
                    placeholder="nome.usuario"
                    autocomplete="username"
                    required>
                <span class="form-text">Letras, números, ponto, hífen ou sublinhado.</span>
            </div>

            <div class="field-wrap">
                <label for="setor_id">Setor <span class="fw-normal auth-optional">(opcional)</span></label>
                <i class="fas fa-building field-icon-left"></i>
                <input id="setor_id" name="setor_id" type="number"
                    class="form-control"
                    min="1"
                    placeholder="ID do setor">
            </div>

            <div class="field-wrap">
                <label for="senha">Senha</label>
                <i class="fas fa-lock field-icon-left"></i>
                <input id="senha" name="senha" type="password"
                    class="form-control"
                    minlength="8"
                    placeholder="Mínimo 8 caracteres"
                    autocomplete="new-password"
                    required>
                <i class="fas fa-eye field-icon-right" id="toggleSenha" role="button" aria-label="Mostrar senha"></i>
                <span class="form-text">Mínimo de 8 caracteres.</span>
            </div>

            <div class="field-wrap auth-field-last">
                <label for="confirmar_senha">Confirmar senha</label>
                <i class="fas fa-lock field-icon-left"></i>
                <input id="confirmar_senha" name="confirmar_senha" type="password"
                    class="form-control"
                    minlength="8"
                    placeholder="Repita a senha"
                    autocomplete="new-password"
                    required>
                <i class="fas fa-eye field-icon-right" id="toggleConfirmar" role="button" aria-label="Mostrar senha"></i>
            </div>

            <button type="submit" class="btn btn-primary btn-create w-100 shadow-sm mb-3">
                <span id="btnText">Criar conta</span>
                <span id="btnSpinner" class="d-none">
                    <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Criando…
                </span>
            </button>

        </form>

        <p class="text-center mb-0 auth-footnote">
            Já tem uma conta?
            <a href="/login" class="fw-semibold text-decoration-none auth-link">Entrar</a>
        </p>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function setupToggle(toggleId, inputId) {
        const btn   = document.getElementById(toggleId);
        const input = document.getElementById(inputId);
        btn?.addEventListener('click', () => {
            const show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            btn.classList.toggle('fa-eye',      !show);
            btn.classList.toggle('fa-eye-slash', show);
        });
    }
    setupToggle('toggleSenha',     'senha');
    setupToggle('toggleConfirmar', 'confirmar_senha');

    document.getElementById('registerForm')?.addEventListener('submit', () => {
        document.getElementById('btnText').classList.add('d-none');
        document.getElementById('btnSpinner').classList.remove('d-none');
    });
</script>
</body>
</html>
